    <path d="M6 15 V8 H13"/><path d="M35 8 H42 V15"/><path d="M42 33 V40 H35"/><path d="M13 40 H6 V33"/>
  </g>
  <defs><mask id="face"><rect width="48" height="48" fill="#fff"/>
