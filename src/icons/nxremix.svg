<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A game frame on a screen, half remastered: faint (stock) on the right of the
       divider, solid with a sun (remastered) on the left. Animated on hover: .wipe and
       .seam slide the divider back and forth like a compare slider; .glint twinkles. -->
  <defs><clipPath id="done"><rect class="wipe" x="-20" y="0" width="44" height="48"/></clipPath></defs>
  <rect x="8" y="43" width="32" height="2.4" rx="1.2" opacity=".3"/>
  <rect x="21" y="35" width="6" height="5" opacity=".7"/>
  <rect x="15" y="39.5" width="18" height="3" rx="1.5"/>
  <path fill-rule="evenodd" d="M8 7 H40 A4 4 0 0 1 44 11 V32 A4 4 0 0 1 40 36 H8 A4 4 0 0 1 4 32 V11 A4 4 0 0 1 8 7 Z M9 10.5 A1.5 1.5 0 0 0 7.5 12 V31 A1.5 1.5 0 0 0 9 32.5 H39 A1.5 1.5 0 0 0 40.5 31 V12 A1.5 1.5 0 0 0 39 10.5 Z"/>
  <g opacity=".38">
    <circle cx="12.5" cy="15" r="2.4"/>
    <path d="M7.5 32.5 V27.5 L15 19.5 L20 24.5 L28 16.5 L40.5 28 V32.5 Z"/>
  </g>
  <g clip-path="url(#done)">
    <rect x="7.5" y="10.5" width="33" height="22" rx="1.5" opacity=".18"/>
    <circle cx="12.5" cy="15" r="2.4"/>
    <path d="M7.5 32.5 V27.5 L15 19.5 L20 24.5 L28 16.5 L40.5 28 V32.5 Z" opacity=".8"/>
    <path class="glint" d="M35 11.5 Q35.5 14 38 14.5 Q35.5 15 35 17.5 Q34.5 15 32 14.5 Q34.5 14 35 11.5 Z"/>
  </g>
  <g class="seam">
    <rect x="22.6" y="10.5" width="2.8" height="22" fill="#fff"/>
    <rect x="23.25" y="10.5" width="1.5" height="22"/>
    <circle cx="24" cy="21.5" r="3"/>
    <circle cx="24" cy="21.5" r="1.2" fill="#fff"/>
  </g>
</svg>
