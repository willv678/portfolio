<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Animated on hover (see "Icon motion" in global.css): .ufo bobs, .beam-wrap
       stretches with it, .beam switches on and flickers, .save rises up the beam. -->
  <defs>
    <mask id="hull"><rect width="48" height="48" fill="#fff"/>
      <circle cx="15" cy="21.5" r="1.8" fill="#000"/><circle cx="24" cy="23" r="1.8" fill="#000"/><circle cx="33" cy="21.5" r="1.8" fill="#000"/></mask>
    <mask id="cut"><rect width="48" height="48" fill="#fff"/><ellipse cx="24" cy="20" rx="20" ry="6.6" fill="#000"/></mask>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".5"/><stop offset="1" stop-color="currentColor" stop-opacity=".05"/></linearGradient>
  </defs>
  <g class="beam-wrap"><path class="beam" d="M17 26 H31 L39 45 H9 Z" fill="url(#beam)"/></g>
  <g class="save">
    <rect x="20.5" y="33" width="7" height="7" rx="1.2"/>
    <rect x="22" y="36.6" width="4" height="2.2" rx=".4" fill="#fff" opacity=".9"/>
  </g>
  <g class="ufo">
    <path d="M14.5 17 A9.5 9.5 0 0 1 33.5 17 V19 H14.5 Z" mask="url(#cut)" opacity=".55"/>
    <ellipse cx="24" cy="21.5" rx="18.5" ry="5.2" mask="url(#hull)"/>
  </g>
</svg>
