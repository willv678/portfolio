  <rect x="9" y="15" width="3" height="26" rx="1.5"/>
  <rect x="36" y="15" width="3" height="26" rx="1.5"/>
  <rect x="7" y="12.5" width="34" height="4" rx="2"/>
  <rect x="19.5" y="2.5" width="9" height="10" rx="2.5" opacity=".85"/>
  <circle class="lamp" cx="24" cy="7.5" r="2.6" fill="#fff"/>
  <g class="car">
